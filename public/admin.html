<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UBGChat - Owner Panel</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <style>
            .userlistEL {
                display: flex;
                justify-content: center;
                flex-direction: row;
                padding: 5px;
            }
        </style>
        <script type="module">
            const meRes = await fetch("/is-owner");
            if (meRes.status !== 200) {
                alert("You aren't me bro...");
                window.location.href = "/";
            }
        </script>
        <div class="title-part">UBGChat Owner Panel</div>
        <div class="text">
            This should only show up if you're me... hopefully.<br />
            Either way i'm gonna try to protect the API anyways just to be
            safe<br />
            alr heres the buttons you want<br />
            <button type="button" onclick="submitThingy('deleteAll')">
                Delete All Messages
            </button>
            <button type="button" onclick="submitThingy('create-test-user')">
                Create Test User
            </button>
            <button type="button" onclick="submitThingy('delete-test-user')">
                Delete Test User
            </button>
            <div class="users">
                List of Users:
                <ul></ul>
            </div>
        </div>
        <script>
            async function submitThingy(type) {
                let res = await fetch("/owner-api/" + type, {
                    method: "POST",
                });
                let txt = await res.text();
                alert(
                    `${type} returned a ${res.status} with the response of ${txt}`,
                );
            }
            async function getUsers() {
                let res = await fetch("/owner-api/get-users");
                let json = await res.json();
                const userlist = document.querySelector("ul");
                for (let user in json) {
                    const content = document.createElement("div");
                    content.classList.add("userlistEL");
                    const li = document.createElement("li");
                    li.innerText = user;
                    content.appendChild(li);
                    if (!json[user]["owner"]) {
                        const button = document.createElement("button");
                        button.innerText = "Delete " + user;
                        content.appendChild(button);
                    }
                    userlist.appendChild(content);
                }
            }
            getUsers();
        </script>
    </body>
</html>
